<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习强国积分截图生成器</title>
<style>
  @font-face {
    font-family: 'Source Han Sans CN';
    src: local('Source Han Sans CN'), local('Noto Sans CJK SC'), local('PingFang SC');
  }

  /* 像素级色值表 */
  :root {
    --c-white: #FFFFFF;
    --c-black: #000000;
    --c-grey: #999999;
    --c-grey-dark: #666666;
    --c-red: #E53935;
    --c-blue: #1976D2;
    --c-blue-avatar: #2196F3;
    --c-bar-norm-top: #FFE0E0;
    --c-bar-norm-bot: #FFCCCC;
    --c-bar-sel-top: #FF3333;
    --c-bar-sel-bot: #FF9933;
    --c-bar-sel-bg: #FFF0F0;
    --c-timeline: #E0E0E0;
    --c-divider: #F0F0F0;
    --c-chart-bg: #F5F6F8;
    --pw: 375px;
    --ph: 812px;
    /* 基于 960px 原图 × 0.391 缩放 */
    --pad: 19px;       /* 48px → 19px */
    --chart-h: 188px;  /* 480px → 188px */
    --bar-max: 109px;  /* 280px → 109px */
    --bar-w: 31px;     /* 80px → 31px */
    --col-w: 48px;     /* 123.4px → 48px */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Source Han Sans CN', 'PingFang SC', 'Noto Sans CJK SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
    background: #F0F0F0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px;
    gap: 30px;
  }

  /* ===== 手机外框 ===== */
  .phone-wrapper { flex-shrink: 0; position: sticky; top: 20px; }
  .phone-frame {
    width: var(--pw); height: var(--ph);
    background: #1A1A1A; border-radius: 40px; padding: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 0 2px #333; position: relative;
  }
  .phone-notch {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #1A1A1A; border-radius: 0 0 18px 18px; z-index: 10;
  }
  .phone-screen {
    width: 100%; height: 100%; background: var(--c-white); border-radius: 28px;
    overflow: hidden; display: flex; flex-direction: column;
  }

  /* ===== 状态栏 ===== */
  .status-bar {
    height: 44px; padding: 12px 24px 0;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 600; color: var(--c-black); flex-shrink: 0;
  }
  .status-bar .time { font-size: 14px; font-weight: 700; }
  .status-icons { display: flex; align-items: center; gap: 5px; font-size: 10px; }
  .signal-bars { display: flex; align-items: flex-end; gap: 1.5px; height: 12px; }
  .signal-bars .sbar { width: 2.5px; background: var(--c-black); border-radius: 1px; }
  .battery { display: flex; align-items: center; gap: 2px; }
  .battery-body {
    width: 22px; height: 11px; border: 1.2px solid var(--c-black); border-radius: 2px;
    padding: 1.5px; display: flex; align-items: center;
  }
  .battery-fill { height: 100%; background: var(--c-black); border-radius: 1px; }
  .battery-cap { width: 2px; height: 5px; background: var(--c-black); border-radius: 0 1px 1px 0; }

  /* ===== 标题栏 ===== */
  .title-bar {
    height: 44px; display: flex; align-items: center; justify-content: center;
    position: relative; padding: 0 16px; flex-shrink: 0;
    border-bottom: 0.5px solid var(--c-divider);
  }
  .back-btn {
    position: absolute; left: var(--pad); top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 50%; transition: background 0.2s;
  }
  .back-btn:hover { background: #F5F5F5; }
  .back-btn svg { width: 22px; height: 22px; }
  .title-bar .title { font-size: 14px; font-weight: 700; color: var(--c-black); }

  /* ===== 主内容区 ===== */
  .main-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

  /* ===== 柱状图 ===== */
  .chart-section {
    margin: 8px 0 0;
    background: var(--c-chart-bg);
    border-radius: 10px;
    flex-shrink: 0;
    padding: 6px 6px 0;
    position: relative;
  }
  .chart-scroll {
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }
  .chart-scroll::-webkit-scrollbar { display: none; }

  /* 日期行 - 柱状图最上方 */
  .chart-dates {
    display: flex;
    justify-content: space-around;
    padding: 0 4px;
  }
  .chart-date-col {
    width: var(--col-w);
    text-align: center;
    font-size: 11px;
    color: var(--c-grey);
    font-weight: 400;
    padding: 3px 0 4px;
    border-radius: 3px;
  }
  .chart-date-col.sel {
    color: var(--c-red);
    font-weight: 600;
    background: rgba(229,57,53,0.07);
  }

  /* 柱子区域 */
  .chart-bars {
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    height: calc(var(--chart-h) - 24px);
    padding: 0 4px 4px;
    position: relative;
  }

  .bar-col {
    width: var(--col-w);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
    z-index: 1;
    border-radius: 4px;
  }

  /* 选中列背景 */
  .bar-col.sel-bg {
    background: var(--c-bar-sel-bg);
    z-index: 0;
  }

  /* 分数 - 紧贴柱子顶端 */
  .bar-score-label {
    font-size: 11px;
    color: var(--c-grey);
    font-weight: 400;
    line-height: 1;
    padding-bottom: 6px;
  }
  .bar-col.sel .bar-score-label {
    color: var(--c-red);
    font-size: 14px;
    font-weight: 700;
  }

  /* 柱子 */
  .bar-fill {
    width: var(--bar-w);
    border-radius: 4px 4px 0 0;
    transition: height 0.3s;
  }
  .bar-fill.normal {
    background: linear-gradient(180deg, var(--c-bar-norm-top) 0%, var(--c-bar-norm-bot) 100%);
  }
  .bar-fill.sel {
    background: linear-gradient(180deg, var(--c-bar-sel-top) 0%, var(--c-bar-sel-bot) 100%);
  }

  /* 柱子间分隔线 */
  .bar-col::after {
    content: '';
    position: absolute;
    right: 0;
    bottom: 0;
    width: 1px;
    height: 100%;
    background: #EAEAEC;
    z-index: -1;
  }
  .bar-col:last-child::after { display: none; }

  /* ===== 积分汇总卡片 ===== */
  .summary-section {
    padding: 12px var(--pad) 14px;
    flex-shrink: 0;
    border-bottom: 0.5px solid var(--c-divider);
  }
  .summary-row { display: flex; justify-content: space-between; align-items: center; }
  .user-info { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--c-blue-avatar);
    display: flex; align-items: center; justify-content: center;
    color: var(--c-white); font-size: 17px; font-weight: 700;
    flex-shrink: 0; position: relative; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .avatar .avatar-text { position: absolute; color: white; font-size: 18px; font-weight: 700; }
  .user-text .username { font-size: 16px; font-weight: 700; color: var(--c-black); white-space: nowrap; }
  .user-text .date-info { font-size: 12px; color: var(--c-grey); white-space: nowrap; }
  .score-stats { text-align: right; flex-shrink: 0; margin-top: 2px; }
  .daily-score {
    font-weight: 700; color: var(--c-red); white-space: nowrap;
    line-height: 1.3;
  }
  .ds-label { font-size: 15px; }
  .ds-val { font-size: 26px; }
  .yearly-score {
    color: var(--c-blue); font-weight: 600;
    display: flex; align-items: center; justify-content: flex-end; gap: 4px;
    margin-top: 4px;
    line-height: 1.3;
  }
  .ys-label { font-size: 13px; }
  .ys-val { font-size: 13px; }
  /* 信息图标: 原图24px→10px, 圆形边框+感叹号 */
  .info-icon {
    width: 10px; height: 10px;
    flex-shrink: 0;
  }
  .info-icon svg {
    display: block;
  }

  /* ===== 积分明细列表 ===== */
  .detail-section { padding: 4px 0 8px; flex: 1; }

  .detail-item {
    display: flex;
    padding: 0 var(--pad);
  }

  /* 左列: 时间轴 */
  .di-tl {
    width: 18px;
    position: relative;
    flex-shrink: 0;
  }
  /* 竖线纵贯条目, 相邻条目无缝衔接 */
  .di-line {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--c-timeline);
  }
  .detail-item:last-child .di-line { display: none; }

  /* 圆点: 与时间文本视觉居中 */
  .di-dot {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 18px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--c-timeline);
    z-index: 1;
  }

  /* 右列: 内容区 */
  .di-body {
    flex: 1;
    padding-left: 6px;
    min-width: 0;
  }

  /* 第1行: 时间文本 (原图 y=24px → ~9px) */
  .di-time-row {
    padding-top: 10px;
  }
  .di-time {
    font-size: 13px;
    color: var(--c-grey);
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  /* 第2行: 任务名称 + 积分 (原图 y=68px → ~27px, 与圆点同层) */
  .di-task-row {
    display: flex;
    align-items: baseline;
    padding-top: 1px;
    padding-bottom: 6px;
  }
  .di-task {
    font-size: 14px;
    color: var(--c-black);
    font-weight: 400;
    flex: 1;
    min-width: 0;
    line-height: 1.2;
  }
  .di-score {
    font-size: 14px;
    color: var(--c-red);
    font-weight: 600;
    flex-shrink: 0;
    padding-left: 8px;
  }
  .di-score-num { font-size: 18px; }
  .di-score-unit { font-size: 12px; }

  /* ===== 底部导航 ===== */
  .bottom-nav {
    height: 68px; display: flex; align-items: flex-start;
    justify-content: center; gap: 32px; padding-top: 10px;
    border-top: 0.5px solid var(--c-divider); flex-shrink: 0;
  }
  .nav-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }

  /* ===== 编辑面板 ===== */
  .edit-panel {
    width: 360px; background: #FFFFFF; border-radius: 16px;
    padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    position: sticky; top: 20px; flex-shrink: 0;
    max-height: calc(100vh - 40px); overflow-y: auto;
  }
  .edit-panel h2 {
    font-size: 16px; font-weight: 700; color: var(--c-black);
    margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--c-divider);
  }
  .edit-group { margin-bottom: 14px; }
  .edit-group label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--c-grey-dark); margin-bottom: 4px;
  }
  .edit-group input[type="text"],
  .edit-group input[type="date"],
  .edit-group input[type="number"] {
    width: 100%; padding: 8px 12px; border: 1.5px solid #E0E0E0;
    border-radius: 8px; font-size: 14px; font-family: inherit;
    color: var(--c-black); transition: border-color 0.2s;
  }
  .edit-group input:focus {
    outline: none; border-color: var(--c-blue);
    box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
  }
  .edit-group input[type="file"] { font-size: 13px; }

  .week-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 6px;
  }
  .week-grid .day-cell {
    display: flex; flex-direction: column; align-items: center;
  }
  .week-grid .day-label {
    font-size: 11px; color: var(--c-grey); margin-bottom: 2px;
  }
  .week-grid .day-cell input {
    width: 100%; padding: 5px 4px; border: 1.5px solid #E0E0E0;
    border-radius: 6px; font-size: 13px; text-align: center; font-family: inherit;
  }
  .week-grid .day-cell input:focus { outline: none; border-color: var(--c-blue); }
  .week-grid .day-cell.today .day-label { color: var(--c-red); font-weight: 700; }
  .week-grid .day-cell.today input { border-color: var(--c-red); background: #FFF5F5; }

  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-row .btn { flex: 1; font-size: 13px; padding: 8px 0; }
  .btn-row input { font-size: 14px; font-family: inherit; }

  .score-info-card {
    background: #FFF5F5; padding: 10px 14px; border-radius: 8px;
    margin-bottom: 14px;
  }
  .score-info-card .label { font-size: 12px; color: var(--c-red); font-weight: 600; }
  .score-info-card .val { font-size: 18px; font-weight: 700; color: var(--c-red); margin-top: 2px; }
  .score-info-card .val-year { font-size: 14px; color: var(--c-blue); font-weight: 500; }

  .avatar-preview-row {
    display: flex; align-items: center; gap: 10px; margin-top: 6px;
  }
  .mini-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    overflow: hidden; border: 2px solid #E0E0E0;
  }
  .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .btn {
    padding: 11px 18px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { width: 100%; background: var(--c-red); color: white; margin-bottom: 7px; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary { width: 100%; background: #F5F5F5; color: var(--c-black); border: 1px solid #E0E0E0; margin-bottom: 7px; }
  .btn-secondary:hover { background: #ECECEC; }
  .btn-rnd { background: var(--c-blue); color: white; }
  .btn-rnd:hover { opacity: 0.9; }
  .btn-apply { background: #444; color: white; }
  .btn-apply:hover { background: #222; }
  .export-btns { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--c-divider); }
  .btn-ex { width: 100%; background: #333; color: white; margin-bottom: 8px; }
  .btn-ex:hover { background: #222; }

  /* 高级微调 */
  .tune-toggle { padding: 4px 0; }
  .tune-toggle:hover { opacity: 0.7; }
  .tune-row {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 7px; font-size: 12px;
  }
  .tune-row label { flex: 0 0 88px; color: var(--c-grey-dark); font-weight: 500; font-size:11px; }
  .tune-row input[type="range"] { flex: 1; accent-color: var(--c-blue); }
  .tune-row input[type="number"] {
    width: 42px; padding: 2px 4px; border: 1px solid #E0E0E0;
    border-radius: 4px; font-size: 11px; text-align: center; font-family: inherit;
  }

  @media (max-width: 800px) {
    body { flex-direction: column; align-items: center; padding: 10px; gap: 20px; }
    .edit-panel { width: 100%; max-width: 375px; position: static; max-height: none; }
    .phone-wrapper { position: static; }
  }
</style>
</head>
<body>

<!-- ========== 手机 ========== -->
<div class="phone-wrapper">
  <div class="phone-frame">
    <div class="phone-screen" id="phoneScreen">

      <div class="title-bar">
        <div class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"><polyline points="15,4 7,12 15,20"/></svg>
        </div>
        <span class="title">积分明细</span>
      </div>

      <div class="main-content" id="mainContent">
        <!-- 柱状图 -->
        <div class="chart-section">
          <div class="chart-scroll">
            <div class="chart-dates" id="chartDates"></div>
            <div class="chart-bars" id="chartBars"></div>
          </div>
        </div>

        <!-- 积分汇总 -->
        <div class="summary-section">
          <div class="summary-row">
            <div class="user-info">
              <div class="avatar" id="userAvatar"><span class="avatar-text">X</span></div>
              <div class="user-text">
                <div class="username" id="userNameDisplay">X</div>
                <div class="date-info" id="dateInfo">2026.04.05 星期日</div>
              </div>
            </div>
            <div class="score-stats">
              <div class="daily-score"><span class="ds-label" id="dsLabel">当日积分: </span><span class="ds-val" id="dsValue">33</span></div>
              <div class="yearly-score">
                <span class="ys-label" id="ysLabel">年度积分: </span><span class="ys-val" id="ysValue">31</span>
                <span class="info-icon">
                  <svg width="10" height="10" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="#999999" stroke-width="2"/>
                    <rect x="11" y="6" width="2" height="10" rx="1" fill="#999999"/>
                    <circle cx="12" cy="19" r="2" fill="#999999"/>
                  </svg>
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- 积分明细 -->
        <div class="detail-section">
          <div id="detailList"></div>
        </div>
      </div>

      <!-- 底部导航 -->
      <div class="bottom-nav">
        <div class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="#666" stroke-width="1.5"/></svg></div>
        <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="#666" stroke-width="1.5"/></svg></div>
        <div class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24"><polygon points="18,4 6,12 18,20" fill="none" stroke="#666" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
      </div>
    </div>
  </div>
</div>

<!-- ========== 编辑面板 ========== -->
<div class="edit-panel">
  <h2>截图编辑</h2>

  <div class="edit-group">
    <label>目标日期</label>
    <input type="date" id="editDate" value="2026-04-05">
  </div>

  <div class="edit-group">
    <label>用户名称</label>
    <input type="text" id="editName" value="X" maxlength="6" placeholder="输入用户名">
  </div>

  <div class="edit-group">
    <label>头像图片</label>
    <input type="file" id="editAvatar" accept="image/*">
    <div class="avatar-preview-row" id="avatarPreviewRow" style="display:none">
      <div class="mini-avatar"><img id="avatarPreviewImg" src="" alt="预览"></div>
      <button class="btn btn-secondary" style="width:auto; padding:5px 12px; font-size:12px; margin-bottom:0" onclick="resetAvatar()">重置</button>
    </div>
  </div>

  <div class="edit-group">
    <label>本周各日积分</label>
    <div class="week-grid" id="weekGrid"></div>
    <div class="btn-row">
      <button class="btn btn-rnd" onclick="randomizeWeek()">随机本周</button>
      <button class="btn btn-apply" onclick="applyWeekScores()">应用本周</button>
    </div>
  </div>

  <div class="edit-group">
    <label>当日总积分</label>
    <div class="btn-row">
      <input type="number" id="editDailyScore" value="33" min="0" max="100" style="flex:1; padding:8px 12px; border:1.5px solid #E0E0E0; border-radius:8px; font-size:14px; font-family:inherit;">
      <button class="btn btn-apply" onclick="applyDailyFromInput()" style="flex:0 0 auto;">应用</button>
    </div>
  </div>

  <div class="edit-group">
    <label>本周总积分（与各日积分联动）</label>
    <div class="btn-row">
      <input type="number" id="editWeeklyTotal" value="286" min="0" max="700" style="flex:1; padding:8px 12px; border:1.5px solid #E0E0E0; border-radius:8px; font-size:14px; font-family:inherit;">
      <button class="btn btn-apply" onclick="applyWeeklyTotal()" style="flex:0 0 auto;">分配</button>
    </div>
  </div>

  <div class="edit-group">
    <label>年度积分</label>
    <div class="btn-row">
      <input type="number" id="editYearlyScore" value="31" min="0" max="1000" style="flex:1; padding:8px 12px; border:1.5px solid #E0E0E0; border-radius:8px; font-size:14px; font-family:inherit;">
      <button class="btn btn-apply" onclick="applyYearlyFromInput()" style="flex:0 0 auto;">应用</button>
    </div>
  </div>

  <div class="score-info-card">
    <div class="label">当前一览</div>
    <div class="val" id="panelDailyScore">当日: 33分</div>
    <div class="val-year" id="panelYearlyScore">年度: 31分</div>
  </div>

  <button class="btn btn-primary" onclick="regenerateAll()">全部重新随机生成</button>
  <button class="btn btn-secondary" onclick="resetToDefault()">恢复默认示例</button>

  <!-- 高级微调面板 -->
  <div class="tune-section" style="margin-top:16px; padding-top:16px; border-top:1px solid var(--c-divider);">
    <div class="tune-toggle" onclick="toggleTune()" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const DAY_NAMES = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const DEFAULT_WEEKLY = [40,43,43,43,43,40,33];
const DEFAULT_DETAIL = [
  {time:'16:24',task:'每日答题',score:1},
  {time:'16:24',task:'每日答题',score:4},
  {time:'16:24',task:'趣味答题',score:10},
  {time:'14:07',task:'文章时长',score:6},
  {time:'14:07',task:'视听学习',score:6},
  {time:'14:07',task:'阅读文章',score:6},
];

let state = {
  userName:'X',avatarDataUrl:null,
  selectedDate:new Date(2026,3,5),
  weeklyScores:[], detailItems:[],
  yearlyScore:31,
};

function init() {
  if(loadFromStorage()){
    syncAllInputs(); renderAll();
  } else {
    loadDefaultData();
    syncAllInputs(); renderAll();
  }
  document.getElementById('editDate').addEventListener('change',onDateChange);
  document.getElementById('editName').addEventListener('input',onNameChange);
  document.getElementById('editAvatar').addEventListener('change',onAvatarChange);
  // 应用微调默认值
  applyTune();
}
function saveToStorage(){
  const data={
    userName:state.userName,
    selectedDate:fmtISO(state.selectedDate),
    yearlyScore:state.yearlyScore,
    weeklyScores:state.weeklyScores.map(s=>({date:fmtISO(s.date),score:s.score})),
    detailItems:state.detailItems,
  };
  localStorage.setItem('xuexi_state_x',JSON.stringify(data));
}
function loadFromStorage(){
  const raw=localStorage.getItem('xuexi_state_x');
  if(!raw)return false;
  try{
    const data=JSON.parse(raw);
    state.userName=data.userName||'X';
    state.selectedDate=new Date(data.selectedDate||'2026-04-05');
    state.yearlyScore=data.yearlyScore||31;
    state.weeklyScores=(data.weeklyScores||[]).map(s=>({date:new Date(s.date),score:s.score}));
    state.detailItems=data.detailItems||[];
    return true;
  }catch(e){return false;}
}
function loadDefaultData() {
  state.userName='X'; state.avatarDataUrl=null; state.selectedDate=new Date(2026,3,5);
  const sd=new Date(2026,2,30);
  state.weeklyScores=[];
  for(let i=0;i<7;i++){const d=new Date(sd);d.setDate(d.getDate()+i);state.weeklyScores.push({date:d,score:DEFAULT_WEEKLY[i]});}
  state.detailItems=JSON.parse(JSON.stringify(DEFAULT_DETAIL));
}
function syncAllInputs() {
  document.getElementById('editDate').value=fmtISO(state.selectedDate);
  document.getElementById('editName').value=state.userName;
  syncWeekGrid(); syncScoreInputs(); updatePanelScores();
}
function syncScoreInputs() {
  const dt=state.detailItems.reduce((s,i)=>s+i.score,0);
  document.getElementById('editDailyScore').value=dt;
  document.getElementById('editYearlyScore').value=state.yearlyScore;
  const weeklyTotal=state.weeklyScores.reduce((s,d)=>s+d.score,0);
  document.getElementById('editWeeklyTotal').value=weeklyTotal;
}
function syncWeekGrid() {
  const g=document.getElementById('weekGrid'); let h='';
  state.weeklyScores.forEach((day,idx)=>{
    const d=day.date;
    const ds=`${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    h+=`<div class="day-cell${idx===6?' today':''}"><span class="day-label">${ds}</span><input type="number" id="weekDay${idx}" value="${day.score}" min="0" max="100" onchange="onWeekDayChange(${idx})"></div>`;
  });
  g.innerHTML=h;
}
function updatePanelScores() {
  const dt=state.detailItems.reduce((s,i)=>s+i.score,0);
  document.getElementById('panelDailyScore').textContent=`当日: ${dt}分`;
  document.getElementById('panelYearlyScore').textContent=`年度: ${state.yearlyScore}分`;
}

// ===== 分数生成 =====
function generateWeeklyScores(centerDate) {
  const target=140+Math.floor(Math.random()*11);
  const sd=new Date(centerDate);sd.setDate(sd.getDate()-6);
  const scores=[];
  for(let i=0;i<7;i++){const d=new Date(sd);d.setDate(d.getDate()+i);scores.push({date:d,score:10});}
  let rem=target-70,iter=0;
  while(rem>0&&iter<1000){iter++;
    const idx=Math.floor(Math.random()*7);
    if(scores[idx].score>=42)continue;
    const add=Math.min(rem,42-scores[idx].score,Math.floor(Math.random()*10)+1);
    if(add>0){scores[idx].score+=add;rem-=add;}
  }
  return scores;
}
function generateDetailItems(dailyScore) {
  // 直接生成不含订阅项、精确匹配目标分数的积分明细
  let remaining = dailyScore;
  if (remaining < 1) remaining = 1;
  if (remaining > 42) remaining = 42;

  const pool = [
    {task:'每日答题',maxPts:5,split:true},
    Math.random()<0.5?{task:'趣味答题',maxPts:10,split:false}:{task:'趣味答题-组队',maxPts:10,split:false},
    {task:'文章时长',maxPts:6,split:true},
    {task:'视听学习',maxPts:6,split:true},
    {task:'视听学习时长',maxPts:6,split:true},
    {task:'阅读文章',maxPts:6,split:true},
    {task:'本地频道',maxPts:1,split:false},
    {task:'分享',maxPts:1,split:false},
    {task:'发表观点',maxPts:2,split:false},
    {task:'强国运动',maxPts:2,split:false},
  ];

  const later = pool.slice(3); shuffle(later);
  const ordered = [...pool.slice(0,3), ...later];
  const used = [];

  // 第一阶段：分配分数
  for (const item of ordered) {
    if (remaining <= 0) break;
    const canTake = Math.min(item.maxPts, remaining);
    if (canTake <= 0) continue;
    let take;
    if (canTake === item.maxPts && remaining >= item.maxPts + 2) {
      take = canTake; // 剩余充足时尽量取满
    } else {
      take = canTake; // 剩余不够时就取剩下的
    }
    remaining -= take;
    used.push({...item, score: take});
  }

  // 第二阶段：如果还有剩余分数(unlikely but handle)，加到最后一项
  if (remaining > 0 && used.length > 0) {
    const last = used[used.length - 1];
    if (last.score + remaining <= last.maxPts) {
      last.score += remaining;
    }
    remaining = 0;
  }

  // 时间生成
  const nSlots = Math.floor(Math.random() * 2) + 2;
  const slots = [];
  for (let i = 0; i < nSlots; i++) {
    const hh = Math.floor(Math.random() * 14) + 7, mm = Math.floor(Math.random() * 60);
    slots.push(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`);
  }
  slots.sort((a, b) => b.localeCompare(a));

  const items = []; let si = 0;
  for (const item of used) {
    if (item.split && item.score > 1) {
      const s1 = Math.min(1, item.score - 1), s2 = item.score - s1;
      if (s1 > 0) items.push({time: slots[si % nSlots], task: item.task, score: s1});
      if (s2 > 0) items.push({time: slots[si % nSlots], task: item.task, score: s2});
    } else {
      items.push({time: slots[si % nSlots], task: item.task, score: item.score});
    }
    if (items.length % 2 === 0) si++;
  }

  items.sort((a, b) => b.time.localeCompare(a.time));
  return items;
}

// ===== 渲染 =====
function renderAll(){renderChart();renderSummary();renderDetailList();syncWeekGrid();syncScoreInputs();updatePanelScores();saveToStorage();}

function renderChart(){
  const scores=state.weeklyScores;
  const maxS=Math.max(...scores.map(s=>s.score),1);
  const barMaxH=109;

  let datesH='',barsH='';
  scores.forEach((day,idx)=>{
    const d=day.date;
    const ds=`${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    const isSel=isSame(d,state.selectedDate);
    const barH=Math.max(4,(day.score/maxS)*barMaxH);

    datesH+=`<div class="chart-date-col${isSel?' sel':''}">${ds}</div>`;

    const padTop=Math.max(0,barMaxH-barH-9);
    barsH+=`<div class="bar-col${isSel?' sel sel-bg':''}">
      <div class="bar-score-label" style="padding-top:${padTop}px">${day.score}分</div>
      <div class="bar-fill${isSel?' sel':' normal'}" style="height:${barH}px"></div>
    </div>`;
  });
  document.getElementById('chartDates').innerHTML=datesH;
  document.getElementById('chartBars').innerHTML=barsH;
}

function renderSummary(){
  const d=state.selectedDate;
  const dn=DAY_NAMES[d.getDay()];
  const ds=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('userNameDisplay').textContent=state.userName;
  document.getElementById('dateInfo').textContent=ds+' '+dn;

  const av=document.getElementById('userAvatar');
  av.innerHTML=state.avatarDataUrl?`<img src="${state.avatarDataUrl}" alt="头像">`:`<span class="avatar-text">${state.userName.charAt(0)}</span>`;

  const dt=state.detailItems.reduce((s,i)=>s+i.score,0);
  document.getElementById('dsValue').textContent=dt;
  document.getElementById('ysValue').textContent=state.yearlyScore;
}

function renderDetailList(){
  const el=document.getElementById('detailList');
  let h='';
  state.detailItems.forEach((item,idx)=>{
    const isLast=idx===state.detailItems.length-1;
    h+=`<div class="detail-item">
      <div class="di-tl">
        ${!isLast?'<div class="di-line"></div>':''}
        <div class="di-dot"></div>
      </div>
      <div class="di-body">
        <div class="di-time-row">
          <span class="di-time">${item.time}</span>
        </div>
        <div class="di-task-row">
          <span class="di-task">${item.task}</span>
          <span class="di-score"><span class="di-score-num">+${item.score}</span><span class="di-score-unit"> 分</span></span>
        </div>
      </div>
    </div>`;
  });
  el.innerHTML=h;
}

// ===== 事件 =====
function onDateChange(e){
  const p=e.target.value.split('-');
  state.selectedDate=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  regenerateAll();
}
function onNameChange(e){state.userName=e.target.value||'用户';renderAll();}
function onAvatarChange(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    state.avatarDataUrl=ev.target.result;renderSummary();
    document.getElementById('avatarPreviewImg').src=ev.target.result;
    document.getElementById('avatarPreviewRow').style.display='flex';
  };
  rd.readAsDataURL(f);
}
function resetAvatar(){
  state.avatarDataUrl=null;
  document.getElementById('editAvatar').value='';
  document.getElementById('avatarPreviewRow').style.display='none';
  renderSummary();
}
function onWeekDayChange(idx){
  const inp=document.getElementById('weekDay'+idx);
  let v=parseInt(inp.value);if(isNaN(v)||v<0)v=0;if(v>100)v=100;inp.value=v;
  state.weeklyScores[idx].score=v;
  renderChart();
  // 联动本周总积分显示
  const weeklyTotal=state.weeklyScores.reduce((s,d)=>s+d.score,0);
  document.getElementById('editWeeklyTotal').value=weeklyTotal;
  if(idx===6){
    state.detailItems=generateDetailItems(v);
    renderSummary();renderDetailList();syncScoreInputs();updatePanelScores();
  }
  saveToStorage();
}
function applyWeekScores(){
  for(let i=0;i<7;i++){
    const v=parseInt(document.getElementById('weekDay'+i).value);
    state.weeklyScores[i].score=isNaN(v)||v<0?0:Math.min(v,100);
  }
  const ds=state.weeklyScores[6].score;
  state.detailItems=generateDetailItems(ds);
  syncAllInputs();renderAll();
}
function applyWeeklyTotal(){
  let total=parseInt(document.getElementById('editWeeklyTotal').value);
  if(isNaN(total)||total<0)total=0;if(total>700)total=700;
  // 按比例分配本周总分到7天
  const currentTotal=state.weeklyScores.reduce((s,d)=>s+d.score,0)||1;
  let remaining=total;
  const newScores=[];
  for(let i=0;i<7;i++){
    const ratio=state.weeklyScores[i].score/currentTotal;
    let s=Math.round(total*ratio);
    newScores.push(Math.max(0,Math.min(100,s)));
  }
  // 修正四舍五入误差：微调最后一天
  const sum=newScores.reduce((s,v)=>s+v,0);
  const diff=total-sum;
  if(diff!==0&&newScores.length>0){
    const last=Math.max(0,Math.min(100,newScores[newScores.length-1]+diff));
    newScores[newScores.length-1]=last;
  }
  for(let i=0;i<7;i++){state.weeklyScores[i].score=newScores[i];}
  const ds=state.weeklyScores[6].score;
  state.detailItems=generateDetailItems(ds);
  syncAllInputs();renderAll();
}
function applyDailyFromInput(){
  let v=parseInt(document.getElementById('editDailyScore').value);
  if(isNaN(v)||v<0)v=0;if(v>100)v=100;
  document.getElementById('editDailyScore').value=v;
  state.weeklyScores[6].score=v;
  state.detailItems=generateDetailItems(v);
  syncAllInputs();renderAll();
}
function applyYearlyFromInput(){
  let v=parseInt(document.getElementById('editYearlyScore').value);
  if(isNaN(v)||v<0)v=0;if(v>1000)v=1000;
  state.yearlyScore=v;
  document.getElementById('editYearlyScore').value=v;
  renderSummary();updatePanelScores();
}
function regenerateAll(){
  state.weeklyScores=generateWeeklyScores(state.selectedDate);
  const ds=state.weeklyScores[6].score;
  state.detailItems=generateDetailItems(ds);
  syncAllInputs();renderAll();updateStatusBar();
}
function randomizeWeek(){
  state.weeklyScores=generateWeeklyScores(state.selectedDate);
  const ds=state.weeklyScores[6].score;
  state.detailItems=generateDetailItems(ds);
  syncAllInputs();renderAll();updateStatusBar();
}
function resetToDefault(){
  state.selectedDate=new Date(2026,3,5);state.userName='X';state.avatarDataUrl=null;
  state.yearlyScore=31;
  document.getElementById('editDate').value='2026-04-05';
  document.getElementById('editName').value='X';
  document.getElementById('editAvatar').value='';
  document.getElementById('avatarPreviewRow').style.display='none';
  loadDefaultData();
  syncAllInputs();renderAll();updateStatusBar();
}
function updateStatusBar(){
  const hh=8+Math.floor(Math.random()*15),mm=Math.floor(Math.random()*60);
  document.getElementById('statusTime').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  const bat=30+Math.floor(Math.random()*70);
  document.getElementById('batteryFill').style.width=bat+'%';
  document.getElementById('statusBatteryPct').textContent=bat+'%';
  document.getElementById('statusNetSpeed').textContent=(Math.random()*3).toFixed(2)+'KB/s';
}

// ===== 高级微调 =====
function toggleTune(){
  const p=document.getElementById('tunePanel');
  const a=document.getElementById('tuneArrow');
  p.style.display=p.style.display==='none'?'block':'none';
  a.style.transform=p.style.display==='none'?'rotate(0deg)':'rotate(180deg)';
}
function applyTune(){
  const keys=['dotTop','dotSize','timePt','timeFs','taskPt','taskFs','scoreFs','scoreUn','lineW','lineBot','dateFs','dslFs','dsvFs','yslFs','ysvFs','yearlyPt'];
  keys.forEach(k=>{
    const r=document.getElementById('tune'+k.charAt(0).toUpperCase()+k.slice(1));
    const n=document.getElementById('tune'+k.charAt(0).toUpperCase()+k.slice(1)+'N');
    if(!r||!n)return;
    if(document.activeElement===n)n.value=r.value;
    else r.value=n.value;
  });
  const v=k=>document.getElementById('tune'+k.charAt(0).toUpperCase()+k.slice(1)).value;
  const lineTop=parseInt(v('dotTop'))+parseInt(v('dotSize'))/2;
  let id='tune-styles';
  let st=document.getElementById(id);
  if(!st){st=document.createElement('style');st.id=id;document.head.appendChild(st);}
  st.textContent=`
    .di-dot{top:${v('dotTop')}px!important;width:${v('dotSize')}px!important;height:${v('dotSize')}px!important;}
    .di-line{width:${v('lineW')}px!important;top:${lineTop}px!important;bottom:${v('lineBot')}px!important;}
    .di-time{font-size:${v('timeFs')}px!important;}
    .di-time-row{padding-top:${v('timePt')}px!important;}
    .di-task{font-size:${v('taskFs')}px!important;}
    .di-task-row{padding-top:${v('taskPt')}px!important;}
    .di-score-num{font-size:${v('scoreFs')}px!important;}
    .di-score-unit{font-size:${v('scoreUn')}px!important;}
    .date-info{font-size:${v('dateFs')}px!important;}
    .ds-label{font-size:${v('dslFs')}px!important;}
    .ds-val{font-size:${v('dsvFs')}px!important;}
    .ys-label{font-size:${v('yslFs')}px!important;}
    .ys-val{font-size:${v('ysvFs')}px!important;}
    .yearly-score{margin-top:${v('yearlyPt')}px!important;}
  `;
}
document.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{
    const keys=['dotTop','dotSize','timePt','timeFs','taskPt','taskFs','scoreFs','scoreUn','lineW','lineBot','dateFs','dslFs','dsvFs','yslFs','ysvFs','yearlyPt'];
    keys.forEach(k=>{
      const r=document.getElementById('tune'+k.charAt(0).toUpperCase()+k.slice(1));
      const n=document.getElementById('tune'+k.charAt(0).toUpperCase()+k.slice(1)+'N');
      if(r&&n){
        r.addEventListener('input',()=>{n.value=r.value;applyTune();});
        n.addEventListener('input',()=>{r.value=n.value;applyTune();});
      }
    });
  },100);
});
function exportScreenshot(mode){
  const t=mode==='phone'?document.getElementById('phoneScreen').closest('.phone-frame'):document.getElementById('phoneScreen');
  if(typeof html2canvas==='undefined'){alert('截图组件加载中...');return;}
  html2canvas(t,{scale:2,useCORS:true,backgroundColor:mode==='phone'?'#1A1A1A':'#FFFFFF',logging:false})
    .then(c=>{const a=document.createElement('a');a.download=`学习强国积分_${fmtISO(state.selectedDate).replace(/-/g,'')}.png`;a.href=c.toDataURL('image/png');a.click();})
    .catch(e=>{console.error(e);alert('截图失败');});
}
function fmtISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function isSame(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

window.addEventListener('DOMContentLoaded',()=>{init();updateStatusBar();});
</script>
